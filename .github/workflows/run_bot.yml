name: Telegram Sales Bot 24/7

on:
  push:
    branches:
      - main
  schedule:
    # Check/restart every 15 minutes. Concurrency controls ensure only one runs at a time.
    - cron: '*/15 * * * *'
  workflow_dispatch:

# Ensure only one instance of the bot runs at a time to prevent polling conflicts
concurrency:
  group: telegram-sales-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate .env File
        run: |
          echo "${{ secrets.ENV }}" > .env
          # Run for 19800 seconds (5.5 hours) then exit cleanly so GitHub Actions rotates it
          echo "RUN_TIMEOUT=19800" >> .env


      - name: Start Bot Polling
        run: |
          python run_bot.py
